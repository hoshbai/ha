plugins {
    alias(libs.plugins.android.application)
    id 'com.google.gms.google-services'
}

android {
    namespace 'com.example.campus_life_assistant'
    compileSdk 35

    defaultConfig {
        applicationId "com.example.campus_life_assistant"
        minSdk 31
        targetSdk 35
        versionCode 1
        versionName "1.0"

        testInstrumentationRunner "androidx.test.runner.AndroidJUnitRunner"
    }

    buildTypes {
        release {
            minifyEnabled false
            proguardFiles getDefaultProguardFile('proguard-android-optimize.txt'), 'proguard-rules.pro'
        }
    }
    compileOptions {
        sourceCompatibility JavaVersion.VERSION_11
        targetCompatibility JavaVersion.VERSION_11
    }

}

dependencies {
    // 必需项：OkHttp核心库
    implementation 'com.squareup.okhttp3:okhttp:4.10.0'

    // 日志拦截器（解决找不到HttpLoggingInterceptor的问题）
    implementation 'com.squareup.okhttp3:logging-interceptor:4.10.0'
    // Retrofit & Gson
    implementation 'com.squareup.retrofit2:retrofit:2.9.0'
    implementation 'com.squareup.retrofit2:converter-gson:2.9.0'
    // Glide
    implementation 'com.github.bumptech.glide:glide:4.12.0'
    annotationProcessor 'com.github.bumptech.glide:compiler:4.12.0'
    implementation 'com.google.firebase:firebase-auth:21.4.0'
    implementation 'pub.devrel:easypermissions:3.0.0'
    // Security library for EncryptedSharedPreferences
    implementation "androidx.security:security-crypto:1.1.0-alpha06"
    implementation 'com.google.firebase:firebase-database:20.3.1'
    implementation platform('com.google.firebase:firebase-bom:33.12.0')
    implementation 'com.google.firebase:firebase-analytics'
    // Gson for JSON parsing
    implementation 'com.google.code.gson:gson:2.10.1'
    implementation libs.appcompat
    implementation libs.material
    implementation libs.activity
    implementation libs.constraintlayout
    implementation 'mysql:mysql-connector-java:5.1.49'
    implementation libs.recyclerview
    implementation files('src/main/libs/AMap3DMap_10.1.201_AMapNavi_10.1.201_AMapSearch_9.7.4_AMapLocation_6.4.9_20250326.jar')

    // 添加SwipeRefreshLayout依赖
    implementation 'androidx.swiperefreshlayout:swiperefreshlayout:1.1.0'

    testImplementation libs.junit
    androidTestImplementation libs.ext.junit
    androidTestImplementation libs.espresso.core
    implementation 'androidx.recyclerview:recyclerview:1.3.1'

    implementation 'com.squareup.retrofit2:retrofit:2.9.0'
    implementation 'com.squareup.retrofit2:converter-gson:2.9.0'
    implementation 'androidx.lifecycle:lifecycle-viewmodel:2.6.1'
    implementation 'com.google.android.material:material:1.9.0'
    implementation 'androidx.recyclerview:recyclerview:1.3.1'
//    implementation 'com.amap.api:map:latest.version' //添加高德地图SDK依赖

    implementation 'com.squareup.okhttp3:okhttp:4.9.3'

}